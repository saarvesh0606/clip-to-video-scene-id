[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sceneid"
version = "2.0.0.dev0"
description = "Identify which indexed video a short clip comes from, and where in it the clip starts."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sarvesh Jagtap" }]
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "faiss-cpu>=1.8",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
# The CLIP embedder. Kept optional so tests and CI run without torch.
clip = ["torch>=2.2", "sentence-transformers>=3.0", "pillow>=10"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9", "prometheus-client>=0.20"]
dev = ["sceneid[api]", "pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
sceneid = "sceneid.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["tests/legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Query", "fastapi.Depends"]
